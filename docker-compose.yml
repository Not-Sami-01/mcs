# Local development database only. Production uses a managed PostgreSQL.
# Credentials here are non-secret local defaults; the real values live in .env.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mcs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcs
      POSTGRES_PASSWORD: mcs_dev_password
      POSTGRES_DB: mcs
    ports:
      - '5432:5432'
    volumes:
      - mcs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcs -d mcs']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mcs-postgres-data:
