name: CI

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcs
          POSTGRES_PASSWORD: mcs_dev_password
          POSTGRES_DB: mcs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcs -d mcs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SITE_ENV: staging
      DATABASE_URL: postgresql://mcs:mcs_dev_password@localhost:5432/mcs
      PAYLOAD_SECRET: ci-only-placeholder-secret-not-used-in-production
      # Valid 64-hex placeholder so the TOTP integration test can encrypt secrets.
      # CI only; never reuse it anywhere else.
      TOTP_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      # Placeholder Filebase config: payload.config.ts requires these names to exist.
      # No upload tests run in CI, so the values are never used to reach Filebase.
      FILEBASE_ENDPOINT: https://s3.filebase.io
      FILEBASE_REGION: auto
      FILEBASE_BUCKET: ci-placeholder
      FILEBASE_ACCESS_KEY_ID: ci-placeholder
      FILEBASE_SECRET_ACCESS_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Schema first: CI's Postgres is empty, the TOTP integration test needs the
      # tables, and `next build` prerenders pages that query Payload
      # (payload.config never pushes schema outside development).
      - run: pnpm payload migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
